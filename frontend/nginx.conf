server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolver DNS internal Docker, supaya nama service "backend" bisa di-resolve.
    resolver 127.0.0.11 valid=10s;

    # Permintaan API diteruskan ke service "backend" lewat nama service (bukan IP).
    location /api/ {
        set $backend_upstream http://backend:80;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Aplikasi Vue (SPA): route lain dikembalikan ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}