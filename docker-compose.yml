name: booking-app

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?isi DB_DATABASE di file .env}
      MYSQL_USER: ${DB_USERNAME:?isi DB_USERNAME di file .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di file .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?isi DB_ROOT_PASSWORD di file .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - booking-net

  backend:
    build:
      context: ./backend
    image: booking-backend:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: BookingAPI
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?isi APP_KEY di file .env}
      APP_URL: http://localhost:8000
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      ADMIN_EMAIL: ${ADMIN_EMAIL:?isi ADMIN_EMAIL di file .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?isi ADMIN_PASSWORD di file .env}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "8000:80"
    networks:
      - booking-net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    image: booking-frontend:local
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - booking-net

volumes:
  db_data:

networks:
  booking-net: