name: booking-app

# Batas ukuran log: tiap container maksimal 3 berkas x 10 MB.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?isi DB_DATABASE di file .env}
      MYSQL_USER: ${DB_USERNAME:?isi DB_USERNAME di file .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di file .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?isi DB_ROOT_PASSWORD di file .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging: *default-logging
    networks:
      - booking-net

  backend:
    build:
      context: ./backend
    image: booking-backend:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Saat db mati, nama "db" hilang dari DNS Docker. Tanpa batas ini, pencarian
    # DNS bisa menggantung melewati batas waktu PHP (30 detik) dan /health
    # membalas 500, bukan 503. Dengan opsi ini DNS gagal dalam ~1-2 detik.
    dns_opt:
      - "timeout:1"
      - "attempts:1"
    environment:
      APP_NAME: BookingAPI
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?isi APP_KEY di file .env}
      APP_URL: http://localhost:8000
      LOG_CHANNEL: stdout
      LOG_LEVEL: info
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      ADMIN_EMAIL: ${ADMIN_EMAIL:?isi ADMIN_EMAIL di file .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?isi ADMIN_PASSWORD di file .env}
    healthcheck:
      # /health memeriksa database dan cache; curl -f membuat respons 503 dianggap gagal.
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging
    ports:
      - "8000:80"
    networks:
      - booking-net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    image: booking-frontend:local
    restart: unless-stopped
    depends_on:
      - backend
    logging: *default-logging
    ports:
      - "8080:80"
    networks:
      - booking-net

  prometheus:
    image: prom/prometheus:v2.53.3
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
      - cadvisor
      - node-exporter
    logging: *default-logging
    networks:
      - booking-net

  grafana:
    image: grafana/grafana:11.2.2
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboard.json:/var/lib/grafana/dashboards/dashboard.json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    logging: *default-logging
    networks:
      - booking-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8081:8080"
    logging: *default-logging
    networks:
      - booking-net

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    logging: *default-logging
    networks:
      - booking-net

volumes:
  db_data:
  prometheus_data:
  grafana_data:

networks:
  booking-net:
